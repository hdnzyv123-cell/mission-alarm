name: mission_alarm
description: Open-source, offline-first, zero-failure Mission Alarm application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  mobile_scanner: ^5.1.1
  sensors_plus: ^5.0.1
  file_picker: ^8.0.5
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/siren_110db.mp3
    - assets/sounds/nuclear_klaxon.mp3
    - assets/sounds/classic_digital.mp3
